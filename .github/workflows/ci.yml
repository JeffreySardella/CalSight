name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least-privilege default for every job: read-only. CI jobs run untrusted
# lifecycle scripts (npm ci / pip install) and unpinned tools, so the default
# token must not be able to write. Jobs that genuinely need a write scope
# grant it themselves (see the `security` job's security-events: write for
# CodeQL/bandit upload). No job posts PR comments, so pull-requests: write is
# not granted anywhere.
permissions:
  contents: read

concurrency:
  # Superseded pushes to the same branch/PR cancel the in-flight run. Safe for
  # CI (nothing stateful gets interrupted), unlike deploy where it isn't. A
  # cancelled main run never deploys — the newer commit's run deploys instead.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: calsight
          POSTGRES_PASSWORD: calsight_dev
          POSTGRES_DB: calsight
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Don't leave the job token on disk for untrusted install scripts to read.
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Run unit tests
        env:
          DATABASE_URL: postgresql://calsight:calsight_dev@localhost:5433/calsight
        run: pytest -m "not integration"
      - name: Run integration tests
        env:
          TEST_DATABASE_URL: postgresql://calsight:calsight_dev@localhost:5433/calsight_test
          TEST_DATABASE_ADMIN_URL: postgresql://calsight:calsight_dev@localhost:5433/postgres
        run: pytest -m integration

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Don't leave the job token on disk for untrusted install scripts to read.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx eslint .
      - run: npx tsc --noEmit
      - run: npm test
      # Gate the production vite build: Cloudflare Pages publishes on push to
      # main independently of CI, so a build-breaking change (PWA plugin, CSP
      # hashes, rollup config) must fail CI here — tsc/vitest alone don't
      # exercise the build.
      - run: npm run build

  security:
    runs-on: ubuntu-latest
    # This is the only job that needs a write scope: CodeQL's analyze step
    # uploads SARIF results to the code-scanning API. contents: read is still
    # required for the checkout. No other job overrides the read-only default.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Don't leave the job token on disk for untrusted install scripts to read.
          persist-credentials: false

      # CodeQL — static analysis for TypeScript + Python
      - name: Initialize CodeQL
        uses: github/codeql-action/init@b22c66273205240d86582638b860f9b25772b4d3 # v3
        with:
          languages: javascript-typescript, python
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b22c66273205240d86582638b860f9b25772b4d3 # v3

      # Bandit — Python-specific security linter
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install bandit
      # Scan the ETL package too: backend/etl/ is where the subprocess,
      # pg_dump, and outbound-network code lives (the highest-value SAST target).
      - name: Run Bandit (Python SAST)
        run: bandit -r backend/app/ backend/etl/ -f json -o bandit-report.json --severity-level high
      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 14

      # npm audit — dependency vulnerability check
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      # Non-blocking, mirroring pip-audit below: a new upstream advisory (often
      # dev-tree only, no fix available) must not gate all production deploys,
      # including an emergency security fix. Surfaces high/critical vulns in the
      # log without failing the job; real vulns are tracked via dependabot.
      - name: npm audit (frontend, non-blocking)
        continue-on-error: true
        working-directory: frontend
        run: npm audit --audit-level=high

      # pip-audit — backend dependency CVE check (issue #300). Non-blocking:
      # a new upstream advisory must not gate deploys (see audit M-I5 for why
      # the npm gate above is debatable); this surfaces CVEs without blocking.
      - name: pip-audit (backend, non-blocking)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Don't leave the job token on disk for untrusted install scripts to read.
          persist-credentials: false
      - name: Stage county boundaries for coord validation
        run: |
          mkdir -p backend/data
          cp frontend/public/ca-counties.geojson backend/data/ca-counties-tiger.geojson
      - name: Build backend Docker image (no push)
        run: docker compose -f docker-compose.prod.yml build backend

  lighthouse:
    runs-on: ubuntu-latest
    needs: frontend
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Don't leave the job token on disk for untrusted install scripts to read.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli
          npx serve -s dist -p 3000 &
          sleep 3
          lhci autorun --config=lighthouserc.json || true
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse-report
          path: frontend/lighthouse-results/
          retention-days: 14
