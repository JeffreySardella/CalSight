name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: calsight
          POSTGRES_PASSWORD: calsight_dev
          POSTGRES_DB: calsight
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Run unit tests
        env:
          DATABASE_URL: postgresql://calsight:calsight_dev@localhost:5433/calsight
        run: pytest -m "not integration"
      - name: Run integration tests
        env:
          TEST_DATABASE_URL: postgresql://calsight:calsight_dev@localhost:5433/calsight_test
          TEST_DATABASE_ADMIN_URL: postgresql://calsight:calsight_dev@localhost:5433/postgres
        run: pytest -m integration

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx eslint .
      - run: npx tsc --noEmit
      - run: npm test

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # CodeQL — static analysis for TypeScript + Python
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript, python
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      # Bandit — Python-specific security linter
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit
      - name: Run Bandit (Python SAST)
        run: bandit -r backend/app/ -f json -o bandit-report.json --severity-level high
      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 14

      # npm audit — dependency vulnerability check
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm audit (frontend)
        working-directory: frontend
        run: npm audit --audit-level=high

  lighthouse:
    runs-on: ubuntu-latest
    needs: frontend
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli
          npx serve -s dist -p 3000 &
          sleep 3
          lhci autorun --config=lighthouserc.json || true
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: frontend/lighthouse-results/
          retention-days: 14
