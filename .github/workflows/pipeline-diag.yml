name: Pipeline Diagnostics

# Read-only look at the ETL pipeline container on the prod runner (LXC 100):
# state, restart count, and recent logs. Exists because the deploy workflow's
# failure notification only captures BACKEND logs — when the pipeline
# container crash-loops (2026-07-13 incident), nothing surfaces its traceback.
# No checkout, no compose, no mutex: plain docker reads, safe to run anytime.

on:
  workflow_dispatch:
    inputs:
      tail:
        description: "How many log lines to show"
        required: false
        default: "200"

permissions:
  contents: read

jobs:
  diag:
    runs-on: self-hosted
    env:
      TAIL: ${{ inputs.tail }}
    steps:
      - name: Validate tail input
        run: |
          if ! printf '%s' "$TAIL" | grep -Eq '^[0-9]{1,4}$'; then
            echo "tail must be a number (1-4 digits), got: $TAIL" >&2
            exit 1
          fi

      - name: Container state
        run: |
          docker ps -a --filter name=pipeline --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'
          for c in $(docker ps -a --filter name=pipeline --format '{{.Names}}'); do
            docker inspect "$c" --format "$c: state={{.State.Status}} exit={{.State.ExitCode}} restarts={{.RestartCount}} started={{.State.StartedAt}} oom={{.State.OOMKilled}}"
          done

      - name: Pipeline logs
        run: |
          for c in $(docker ps -a --filter name=pipeline --format '{{.Names}}'); do
            echo "===== logs: $c (last $TAIL lines) ====="
            docker logs --tail "$TAIL" "$c" 2>&1 || true
          done

      # The live ETL/backup scheduler on this box is the HOST CRON, not the
      # containerized pipeline scheduler (verified at the box 2026-07-18, issue
      # #370). That crontab exists only here — the one machine a disaster
      # recovery would be rebuilding — so RESTORE_RUNBOOK.md §4f has never been
      # able to state the real schedule. Print it so it can be committed.
      #
      # Read-only, and secrets are redacted below: the line is expected to
      # source .env and curl a healthchecks.io URL, and a workflow log is not
      # the place for either.
      - name: Scheduler visibility (crontab, redacted)
        run: |
          echo "===== runner identity ====="
          echo "user=$(id -un) uid=$(id -u)"

          redact() {
            sed -E \
              -e 's#(hc-ping\.com/)[A-Za-z0-9-]+#\1<REDACTED>#g' \
              -e 's#(https?://)[^ "]*(webhook|token|key)[^ "]*#\1<REDACTED>#gI' \
              -e 's/([A-Za-z_]*(PASSWORD|SECRET|TOKEN|KEY)[A-Za-z_]*=)[^ ]*/\1<REDACTED>/gI'
          }

          echo "===== crontab -l (this user) ====="
          crontab -l 2>&1 | redact || echo "(none for $(id -un))"

          if [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null 2>&1; then
            echo "===== crontab -l -u root (if permitted) ====="
            sudo -n crontab -l -u root 2>&1 | redact || echo "(no passwordless sudo — run 'crontab -l' as root by hand)"
          fi

          echo "===== /etc/cron.d and /etc/crontab ====="
          grep -RhE 'calsight|etl|backup' /etc/crontab /etc/cron.d/ 2>/dev/null | redact || echo "(nothing matching in /etc/cron.d)"

          echo "===== systemd timers (in case any exist) ====="
          systemctl list-timers --all --no-pager 2>/dev/null | grep -iE 'calsight|etl|backup' || echo "(none)"

          # The crontab only names a wrapper script, which itself lives nowhere
          # but this box — so the schedule alone doesn't close the DR gap. Print
          # the wrapper (redacted) so it can be committed alongside it.
          echo "===== cron wrapper scripts ====="
          for s in $(sudo -n crontab -l -u root 2>/dev/null | grep -oE '/[^ ]+\.sh' | sort -u); do
            echo "--- $s ---"
            sudo -n cat "$s" 2>/dev/null | redact || echo "(cannot read $s)"
          done

          # Open question the crontab raised: R2 holds dumps named
          # calsight_<date>_<time>.dump.gz, but etl/backup.py writes
          # calsight_<date>.dump — no timestamp, no gzip — and "backup" is not
          # a job in the ETL registry. So something OTHER than the code we
          # hardened may be producing the backups. Find it.
          echo "===== all crontabs, every user ====="
          for u in $(sudo -n cut -d: -f1 /etc/passwd 2>/dev/null); do
            out=$(sudo -n crontab -l -u "$u" 2>/dev/null | grep -vE '^\s*#|^\s*$' || true)
            # `[ -n ... ] && {...}` returns 1 for every user WITHOUT a crontab,
            # which under `bash -e` killed the whole step on the first such user.
            if [ -n "$out" ]; then echo "--- $u ---"; printf '%s\n' "$out" | redact; fi
          done

          # Every probe below is non-fatal: the step runs under `bash -e`, so a
          # grep with no matches would otherwise abort the whole diagnostic.
          echo "===== backup-related scripts on the box ====="
          { sudo -n ls -la /usr/local/bin/ 2>/dev/null || true; } | grep -iE 'backup|etl|calsight' || echo "(none in /usr/local/bin)"

          echo "===== local backup directory ====="
          { sudo -n ls -la /opt/calsight/backups/ 2>/dev/null || true; } | tail -6 || true
          echo "(end of backup dir listing)"

          echo "===== any script mentioning pg_dump / R2 ====="
          { sudo -n grep -rlE 'pg_dump|r2\.cloudflarestorage|calsight-backups' /usr/local/bin /etc/cron.d /root /opt 2>/dev/null || true; } | head -5 || true
          echo "(end of grep)"

          echo "===== containers on this box (is the pipeline scheduler live?) ====="
          { docker ps -a --format '{{.Names}}\t{{.Status}}' 2>/dev/null || true; } | head -10 || true

          echo "===== pipeline container's scheduled jobs, if it is running ====="
          { docker logs --tail 40 calsight-pipeline-1 2>&1 || true; } | grep -iE 'schedule|backup|next run' | head -10 || echo "(no scheduler banner found)"
          exit 0
