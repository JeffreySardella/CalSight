name: Deploy to Production

# Deploys are gated on CI: this fires when the "CI" workflow finishes, and the
# jobs below only run if that CI run succeeded on main. A push to main
# therefore deploys only after its CI run goes green — nothing deploys for
# failed or cancelled CI runs (including runs superseded by CI's
# cancel-in-progress; the newer commit's run deploys instead).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  # Shared with run-etl.yml so a deploy and a manual ETL run are mutually
  # exclusive: a deploy's `up -d` recreates the backend container, which
  # would kill an in-flight ETL exec mid-write and strand a zombie
  # `running` row (audit 2026-07-09 M1). Disjoint groups only serialized
  # deploys against deploys.
  group: prod-mutex
  # Queue instead of cancelling in-flight runs — killing a deploy mid-run
  # can interrupt a live database migration, and killing an ETL run leaves
  # partial writes.
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The commit being deployed. For workflow_run events github.sha is the
  # default-branch head at trigger time — which can already be NEWER than the
  # commit CI validated — so use the SHA the CI run actually ran on. The
  # github.sha fallback only applies if another trigger (e.g.
  # workflow_dispatch) is ever added.
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  check-backfill:
    # Only deploy commits whose CI run succeeded on a push to main in THIS
    # repo. The event/head_repository checks matter: CI also runs on
    # pull_request, and a fork PR from a branch literally named "main" would
    # otherwise satisfy the head_branch check and deploy attacker code to the
    # self-hosted runner (GitHub Security Lab's workflow_run spoof pattern).
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: self-hosted
    outputs:
      needed: ${{ steps.check.outputs.needed }}
    steps:
      - name: Verify DEPLOY_SHA is the current main head (re-run guard)
        # workflow_run fires on RE-RUNS of old CI runs too, and DEPLOY_SHA is
        # that run's head_sha — so an innocent "re-run to check flakiness" on
        # a months-old green CI run would silently redeploy that old commit,
        # including running its alembic migrations (audit 2026-07-09 M3).
        # Refuse to deploy any SHA that is no longer the current main head.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MAIN_HEAD=$(git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)
          if [ -z "$MAIN_HEAD" ]; then
            echo "ERROR: could not resolve the current main head via git ls-remote — refusing to deploy." >&2
            exit 1
          fi
          if [ "$MAIN_HEAD" != "$DEPLOY_SHA" ]; then
            echo "ERROR: DEPLOY_SHA ($DEPLOY_SHA) is not the current main head ($MAIN_HEAD)." >&2
            echo "This is most likely a re-run of an old CI run. To deploy the current" >&2
            echo "main, re-run CI on the current head commit instead." >&2
            exit 1
          fi
          echo "DEPLOY_SHA matches current main head — proceeding."

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 2
          # Check out the CI-validated commit, not the default-branch head
          # (which workflow_run would otherwise give us).
          ref: ${{ env.DEPLOY_SHA }}
      - name: Detect migration/backfill changes or [backfill] tag
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEEDED=false
          if git log -1 --format='%s%b' | grep -qi '\[backfill\]'; then
            echo "Commit message contains [backfill]"
            NEEDED=true
          fi
          # Diff against the last successfully deployed SHA when we know it
          # (written to /opt/calsight/.last-deployed-sha at the end of every
          # successful deploy). Diffing only HEAD~1 misses backfill-relevant
          # changes in multi-commit direct pushes — migrations still applied
          # but backfills/matview refreshes were silently skipped (audit
          # 2026-07-09 M4). Fall back to HEAD~1 when the file is absent
          # (first deploy) or the stored SHA is no longer fetchable.
          BASE=""
          LAST_SHA_FILE=/opt/calsight/.last-deployed-sha
          if [ -f "$LAST_SHA_FILE" ]; then
            LAST_SHA=$(cat "$LAST_SHA_FILE")
            if printf '%s' "$LAST_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
              # The checkout is shallow (fetch-depth: 2), so an arbitrary old
              # SHA isn't in the local object store — fetch it explicitly.
              # persist-credentials is false, so authenticate the fetch with
              # the job token. If the SHA no longer exists upstream (history
              # rewrite, GC), fall back to HEAD~1 rather than failing.
              if git cat-file -e "${LAST_SHA}^{commit}" 2>/dev/null \
                 || git fetch --depth=1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$LAST_SHA" 2>/dev/null; then
                BASE="$LAST_SHA"
              else
                echo "Stored last-deployed SHA $LAST_SHA is not fetchable — falling back to HEAD~1"
              fi
            else
              echo "Ignoring malformed $LAST_SHA_FILE contents — falling back to HEAD~1"
            fi
          else
            echo "No $LAST_SHA_FILE (first deploy on this runner) — falling back to HEAD~1"
          fi
          [ -n "$BASE" ] || BASE=HEAD~1
          echo "Diffing $BASE..HEAD for migration/backfill changes"
          if git diff --name-only "$BASE" HEAD -- \
            'backend/migrations/versions/' \
            'backend/etl/backfill_derived.py' \
            'backend/etl/backfill_conditions.py' | grep -q .; then
            echo "Migration or backfill files changed"
            NEEDED=true
          fi
          echo "needed=$NEEDED" >> $GITHUB_OUTPUT

  deploy:
    # Redundant with the check-backfill guard (a skipped `needs` job skips this
    # one too), but explicit so the gate survives future refactors.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    needs: check-backfill
    runs-on: self-hosted
    steps:
      - name: Verify DEPLOY_SHA is the current main head (re-run guard)
        # Duplicated from check-backfill (like the `if:` guard above) so the
        # gate survives future refactors, and because main can advance in the
        # window between the two jobs. See audit 2026-07-09 M3.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MAIN_HEAD=$(git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)
          if [ -z "$MAIN_HEAD" ]; then
            echo "ERROR: could not resolve the current main head via git ls-remote — refusing to deploy." >&2
            exit 1
          fi
          if [ "$MAIN_HEAD" != "$DEPLOY_SHA" ]; then
            echo "ERROR: DEPLOY_SHA ($DEPLOY_SHA) is not the current main head ($MAIN_HEAD)." >&2
            echo "This is most likely a re-run of an old CI run. To deploy the current" >&2
            echo "main, re-run CI on the current head commit instead." >&2
            exit 1
          fi
          echo "DEPLOY_SHA matches current main head — proceeding."

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # Same as check-backfill: deploy the CI-validated commit.
          ref: ${{ env.DEPLOY_SHA }}

      - name: Force HTTPS for git (no SSH keys needed)
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://".insteadOf "git://"

      - name: Create backend .env from secrets
        env:
          DB_URL: ${{ secrets.DATABASE_URL }}
          CORS: ${{ secrets.CORS_ORIGINS }}
          CENSUS: ${{ secrets.CENSUS_API_KEY }}
          NOAA: ${{ secrets.NOAA_API_TOKEN }}
          BLS: ${{ secrets.BLS_API_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CEREBRAS_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          SENTRY: ${{ secrets.SENTRY_DSN }}
        run: |
          # Non-destructive write: operators set keys the workflow does NOT
          # manage (HEARTBEAT_URL, R2_*, DISCORD_BACKUP_WEBHOOK, ETL_API_KEY,
          # ALERT_WEBHOOK_URL, MAINTENANCE_MODE, ETL_DATABASE_URL, ...)
          # directly in backend/.env on the runner. The old `: > backend/.env`
          # truncation wiped them on every deploy — that is exactly how
          # SENTRY_DSN was silently lost before it became a managed key — so
          # write the managed keys to a temp file, carry over every unmanaged
          # line from the existing file, then swap the merged file into place.
          TMP_ENV=$(mktemp backend/.env.XXXXXX)
          printf 'DATABASE_URL=%s\n' "$DB_URL" >> "$TMP_ENV"
          printf 'CORS_ORIGINS=%s\n' "$CORS" >> "$TMP_ENV"
          printf 'CENSUS_API_KEY=%s\n' "$CENSUS" >> "$TMP_ENV"
          printf 'NOAA_API_TOKEN=%s\n' "$NOAA" >> "$TMP_ENV"
          printf 'BLS_API_KEY=%s\n' "$BLS" >> "$TMP_ENV"
          printf 'LLM_PROVIDER=groq\n' >> "$TMP_ENV"
          printf 'LLM_API_KEY=%s\n' "$GROQ_KEY" >> "$TMP_ENV"
          printf 'LLM_API_KEY_2=%s\n' "$GROQ_KEY_2" >> "$TMP_ENV"
          printf 'LLM_FALLBACK_1_PROVIDER=gemini\n' >> "$TMP_ENV"
          printf 'LLM_FALLBACK_1_KEY=%s\n' "$GEMINI_KEY" >> "$TMP_ENV"
          printf 'LLM_FALLBACK_2_PROVIDER=openrouter\n' >> "$TMP_ENV"
          printf 'LLM_FALLBACK_2_KEY=%s\n' "$OPENROUTER_KEY" >> "$TMP_ENV"
          printf 'LLM_FALLBACK_3_PROVIDER=cerebras\n' >> "$TMP_ENV"
          printf 'LLM_FALLBACK_3_KEY=%s\n' "$CEREBRAS_KEY" >> "$TMP_ENV"
          # Activate the daily LLM spend backstop in prod (#293). The setting
          # defaults to 0 = unlimited (fine for local dev), so unless the deploy
          # writes a non-zero value the cap never fires and an IP-rotating
          # abuser can drain the providers' free-tier quotas (audit S-1). The
          # counter is in-process and per-worker, so with 4 gunicorn workers
          # this is an effective ~12k paid calls/day site-wide — comfortably
          # above real demand for this niche civic-data site (well under 1k
          # AI questions/day) yet a hard finite ceiling against sustained abuse.
          # Override per-deploy by exporting LLM_DAILY_REQUEST_BUDGET on the runner.
          printf 'LLM_DAILY_REQUEST_BUDGET=%s\n' "${LLM_DAILY_REQUEST_BUDGET:-3000}" >> "$TMP_ENV"
          printf 'DEBUG=false\n' >> "$TMP_ENV"
          # Sentry error monitoring for the API container. No-op until the
          # SENTRY_DSN repo secret is set (main.py gates on a non-empty DSN),
          # so this is safe to ship before the secret exists.
          printf 'SENTRY_DSN=%s\n' "$SENTRY" >> "$TMP_ENV"
          # Keys this workflow owns — must match the printf list above exactly.
          MANAGED='DATABASE_URL CORS_ORIGINS CENSUS_API_KEY NOAA_API_TOKEN BLS_API_KEY LLM_PROVIDER LLM_API_KEY LLM_API_KEY_2 LLM_FALLBACK_1_PROVIDER LLM_FALLBACK_1_KEY LLM_FALLBACK_2_PROVIDER LLM_FALLBACK_2_KEY LLM_FALLBACK_3_PROVIDER LLM_FALLBACK_3_KEY LLM_DAILY_REQUEST_BUDGET DEBUG SENTRY_DSN'
          if [ -f backend/.env ]; then
            SEEN=" $MANAGED "
            while IFS= read -r LINE || [ -n "$LINE" ]; do
              case "$LINE" in
                ''|'#'*)
                  # Preserve comments and blank lines as-is.
                  printf '%s\n' "$LINE" >> "$TMP_ENV"
                  continue
                  ;;
                *=*)
                  KEY=${LINE%%=*}
                  ;;
                *)
                  printf '%s\n' "$LINE" >> "$TMP_ENV"
                  continue
                  ;;
              esac
              case "$SEEN" in
                *" $KEY "*) ;;  # managed key or duplicate: drop the stale line
                *)
                  printf '%s\n' "$LINE" >> "$TMP_ENV"
                  SEEN="$SEEN$KEY "
                  ;;
              esac
            done < backend/.env
          fi
          mv "$TMP_ENV" backend/.env

      # REMOVED 2026-08-11: "Stop standalone cloudflared (if still running as systemd)",
      # which ran `systemctl disable --now cloudflared 2>/dev/null || true`.
      #
      # That step assumed the CONTAINER tunnel was authoritative and the systemd
      # unit was a leftover. THE REVERSE IS NOW TRUE: the systemd cloudflared on
      # this host is what actually serves api.calsight.org, and the container
      # tunnel was dead (invalid token since the 2026-07-30 rotation) and has
      # been removed from docker-compose.prod.yml.
      #
      # So this step had become a step that kills production on every deploy. It
      # only ever no-opped because the runner user cannot systemctl and `|| true`
      # swallowed the failure — the unit shows NRestarts=0 and has been up
      # continuously since 2026-08-10. That is luck, not design. Removed.

      - name: Stage county boundaries for coord validation
        run: |
          mkdir -p backend/data
          cp frontend/public/ca-counties.geojson backend/data/ca-counties-tiger.geojson

      - name: Build images (without starting)
        env:
          CLOUDFLARED_TOKEN: ${{ secrets.CLOUDFLARED_TOKEN }}
        # Include docker-compose.pipeline.yml: the pipeline service builds its
        # own image (calsight-pipeline) from ./backend, so building only the
        # prod file would leave it on a stale image.
        run: docker compose -f docker-compose.prod.yml -f docker-compose.pipeline.yml build

      - name: Run database migrations (before serving traffic)
        env:
          CLOUDFLARED_TOKEN: ${{ secrets.CLOUDFLARED_TOKEN }}
        run: docker compose -f docker-compose.prod.yml run --rm -T backend alembic upgrade head

      - name: Ensure host backup directory exists and is writable by the pipeline
        # docker-compose.pipeline.yml bind-mounts /opt/calsight/backups into
        # the pipeline container; the mount fails at container start if the
        # host directory is missing (first deploy after the C4 backup fix).
        # The pipeline container runs as the unprivileged `app` user
        # (backend/Dockerfile), so a root-owned 0755 dir makes every scheduled
        # pg_dump fail with EACCES — chown to the image's app UID/GID.
        env:
          CLOUDFLARED_TOKEN: ${{ secrets.CLOUDFLARED_TOKEN }}
        run: |
          mkdir -p /opt/calsight/backups 2>/dev/null || sudo -n mkdir -p /opt/calsight/backups
          APP_UID=$(docker compose -f docker-compose.prod.yml -f docker-compose.pipeline.yml run --rm --no-deps -T pipeline id -u)
          APP_GID=$(docker compose -f docker-compose.prod.yml -f docker-compose.pipeline.yml run --rm --no-deps -T pipeline id -g)
          chown "${APP_UID}:${APP_GID}" /opt/calsight/backups 2>/dev/null \
            || sudo -n chown "${APP_UID}:${APP_GID}" /opt/calsight/backups

      - name: Start backend + ETL pipeline
        env:
          CLOUDFLARED_TOKEN: ${{ secrets.CLOUDFLARED_TOKEN }}
        # Both files, matching how the stack runs in prod (see
        # docker-compose.pipeline.yml). Without the pipeline file here the
        # pipeline container kept running the previous deploy's image forever.
        # `up -d` recreates it on the freshly built image, and also starts it
        # if it isn't running yet (first deploy).
        #
        # --remove-orphans added 2026-08-11: without it, `up -d` LEAVES RUNNING
        # any container whose service has since been deleted from the compose
        # file. That is exactly how the dead calsight-tunnel-1 kept running for
        # days after its service was removed. Both -f files are passed, so every
        # real service is known here and only genuine orphans are removed.
        run: docker compose -f docker-compose.prod.yml -f docker-compose.pipeline.yml up -d --remove-orphans

      - name: Tag images with commit SHA for rollback
        # Both images: rollback restores backend AND pipeline to the previous
        # SHA (audit 2026-07-09 M2) — an untagged pipeline image could never
        # be rolled back.
        run: |
          docker tag calsight-backend:latest "calsight-backend:${DEPLOY_SHA}"
          docker tag calsight-pipeline:latest "calsight-pipeline:${DEPLOY_SHA}"

      - name: Prune old images (keep last 5 SHA tags)
        run: |
          # `docker image prune` only removes dangling images, so SHA-tagged
          # rollback images accumulate forever. Instead keep the 5 newest SHA
          # tags (docker images lists newest first) and remove the rest —
          # never :latest, and never the SHA we just deployed.
          for IMAGE in calsight-backend calsight-pipeline; do
            docker images "$IMAGE" --format '{{.Tag}}' \
              | grep -v '^latest$' \
              | tail -n +6 \
              | grep -v "^${DEPLOY_SHA}$" \
              | while read -r TAG; do
                  docker rmi "${IMAGE}:${TAG}" || true
                done
          done

      - name: Backfill derived fields (severity, flags, driver age, canonical cause)
        if: needs.check-backfill.outputs.needed == 'true'
        run: docker compose -f docker-compose.prod.yml exec -T backend python -m etl.backfill_derived
        timeout-minutes: 240

      - name: Backfill canonical condition columns (weather, lighting, collision, road)
        if: needs.check-backfill.outputs.needed == 'true'
        run: docker compose -f docker-compose.prod.yml exec -T backend python -m etl.backfill_conditions
        timeout-minutes: 240

      - name: Refresh materialized views
        if: needs.check-backfill.outputs.needed == 'true'
        run: docker compose -f docker-compose.prod.yml exec -T backend python -m etl.refresh_materialized_views

      - name: Validate crash coordinates (background, ~15 min)
        if: needs.check-backfill.outputs.needed == 'true'
        run: docker compose -f docker-compose.prod.yml exec -T -d backend python -m etl.validate_coords

      - name: Verify backend is healthy
        env:
          CLOUDFLARED_TOKEN: ${{ secrets.CLOUDFLARED_TOKEN }}
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -sf http://127.0.0.1:8000/api/health > /dev/null; then
              echo "Backend is up"
              break
            fi
            echo "Attempt $i/6 failed, waiting..."
            sleep 5
          done
          if ! curl -sf http://127.0.0.1:8000/api/health > /dev/null; then
            echo "Backend failed to start --- showing logs:"
            docker compose -f docker-compose.prod.yml logs --tail=50 backend
            exit 1
          fi
          # The old "Checking tunnel..." probe was removed 2026-08-11 along with
          # the tunnel service; it failed with `no such service: tunnel` and
          # broke the deploy even though the backend came up healthy.
          #
          # Public reachability is NOT verified here on purpose: ingress is the
          # systemd cloudflared, which this workflow does not manage. That is
          # what uptime.yml checks, from outside, through the edge — which is
          # the only place the check is meaningful.

      - name: Verify pipeline container is stable (not crash-looping)
        # A pipeline container that dies at startup restarts forever and is
        # only "running" a few seconds per minute — every scheduled ETL, backup
        # and vacuum silently stops while `up -d` still reports success. This
        # went unnoticed for weeks (2026-07-13 incident, 257 restarts) because
        # nothing checked the container after start and the failure alert only
        # ships backend logs. Require zero restarts AND a running state, and
        # dump the pipeline's own logs when it fails.
        env:
          CLOUDFLARED_TOKEN: ${{ secrets.CLOUDFLARED_TOKEN }}
        run: |
          CID=$(docker compose -f docker-compose.prod.yml -f docker-compose.pipeline.yml ps -aq pipeline)
          if [ -z "$CID" ]; then
            echo "Pipeline container not found"; exit 1
          fi
          # The container has been up since the `up -d` step several minutes
          # ago — a healthy scheduler has zero restarts by now.
          STATE=$(docker inspect "$CID" --format '{{.State.Status}} restarts={{.RestartCount}}')
          echo "Pipeline container: $STATE"
          if [ "$(docker inspect "$CID" --format '{{.State.Status}}{{.RestartCount}}')" != "running0" ]; then
            echo "Pipeline container is not stably running — recent logs:"
            docker logs --tail=60 "$CID" 2>&1 || true
            exit 1
          fi

      - name: Verify pipeline can write backups
        # Scheduled pg_dump writes to the /backups bind mount as the `app`
        # user; catch a permissions regression at deploy time instead of at
        # restore time (audit 2026-07-09 H5).
        env:
          CLOUDFLARED_TOKEN: ${{ secrets.CLOUDFLARED_TOKEN }}
        run: |
          docker compose -f docker-compose.prod.yml -f docker-compose.pipeline.yml \
            exec -T pipeline sh -c 'touch /backups/.write-test && rm /backups/.write-test' \
            && echo "Backup directory is writable" \
            || { echo "Pipeline cannot write to /backups — backups would fail silently"; \
                 docker compose -f docker-compose.prod.yml -f docker-compose.pipeline.yml logs --tail=60 pipeline || true; \
                 exit 1; }

      - name: Record last successfully deployed SHA
        # Read by check-backfill on the NEXT deploy so it diffs against the
        # previously deployed commit instead of only HEAD~1 (audit 2026-07-09
        # M4). No `if:` — the step only runs when every step above succeeded,
        # i.e. after a healthy, verified deploy.
        run: |
          printf '%s\n' "$DEPLOY_SHA" > /opt/calsight/.last-deployed-sha 2>/dev/null \
            || sudo -n sh -c "printf '%s\n' '$DEPLOY_SHA' > /opt/calsight/.last-deployed-sha"

      - name: Rollback to previous images on failure
        if: failure()
        env:
          CLOUDFLARED_TOKEN: ${{ secrets.CLOUDFLARED_TOKEN }}
        run: |
          echo "Deploy failed — attempting rollback..."
          # The just-deployed SHA is tagged before the health check, so it is
          # the newest tag — skip it (and :latest) to find the previous deploy.
          PREV_SHA=$(docker images calsight-backend --format '{{.Tag}}' | grep -v -e '^latest$' -e "^${DEPLOY_SHA}$" | head -1)
          if [ -n "$PREV_SHA" ]; then
            echo "Rolling back backend + pipeline to :$PREV_SHA"
            docker tag "calsight-backend:${PREV_SHA}" calsight-backend:latest
            # The pipeline image is SHA-tagged alongside the backend, but tags
            # created before that change may not exist — roll it back when the
            # tag is available, otherwise leave the pipeline image untouched.
            if docker image inspect "calsight-pipeline:${PREV_SHA}" >/dev/null 2>&1; then
              docker tag "calsight-pipeline:${PREV_SHA}" calsight-pipeline:latest
            else
              echo "WARNING: no calsight-pipeline:${PREV_SHA} tag (predates pipeline SHA-tagging) — pipeline image left as-is"
            fi
            # NOTE: database migrations are NOT rolled back — there is no
            # automated `alembic downgrade` (downgrades can destroy data and
            # many migrations are irreversible). We assume backward-compatible
            # (expand/contract) migrations, so the previous images must keep
            # working against the already-migrated schema.
            #
            # Both compose files so backend AND pipeline are recreated on the
            # restored :latest images, matching the deploy's `up -d`.
            docker compose -f docker-compose.prod.yml -f docker-compose.pipeline.yml up -d
            # Same 6×5s retry loop as the health-verify step — a single probe
            # after 5s under-measures a gunicorn cold start.
            for i in 1 2 3 4 5 6; do
              if curl -sf http://127.0.0.1:8000/api/health > /dev/null; then
                echo "Backend is up"
                break
              fi
              echo "Attempt $i/6 failed, waiting..."
              sleep 5
            done
            if curl -sf http://127.0.0.1:8000/api/health > /dev/null; then
              echo "Rollback successful — backend is healthy"
            else
              echo "WARNING: Rollback did not restore health"
            fi
          else
            echo "No previous image available for rollback"
          fi

      - name: Collect disk usage for notification
        if: always()
        run: |
          echo "DISK=$(df -h / | awk 'NR==2 {printf "%s used / %s total (%s)", $3, $2, $5}')" >> $GITHUB_ENV
        continue-on-error: true

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_STATUS: ${{ job.status }}
          GH_SHA: ${{ env.DEPLOY_SHA }}
          # workflow_run events carry the commit info under workflow_run.*;
          # head_commit/ref_name describe the triggering event, not the deploy.
          GH_MSG: ${{ github.event.workflow_run.head_commit.message || github.event.head_commit.message }}
          GH_REPO: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          GH_ACTOR: ${{ github.actor }}
          DISK: ${{ env.DISK }}
        run: |
          python3 - <<'PYEOF'
          import json, os, subprocess, urllib.request, sys

          status = os.environ.get("GH_STATUS", "unknown")
          sha = os.environ.get("GH_SHA", "")
          msg = os.environ.get("GH_MSG", "")
          repo = os.environ.get("GH_REPO", "")
          run_id = os.environ.get("GH_RUN_ID", "")
          branch = os.environ.get("GH_BRANCH", "")
          actor = os.environ.get("GH_ACTOR", "")
          webhook = os.environ.get("DISCORD_WEBHOOK_URL", "") + "?wait=true"
          disk = os.environ.get("DISK", "unknown")

          short_sha = sha[:7] if sha else "unknown"
          commit_url = f"https://github.com/{repo}/commit/{sha}"
          run_url = f"https://github.com/{repo}/actions/runs/{run_id}"

          if not webhook:
              print("ERROR: DISCORD_WEBHOOK_URL is not set", file=sys.stderr)
              sys.exit(1)

          try:
              result = subprocess.run(
                  ["docker", "compose", "-f", "docker-compose.prod.yml", "logs", "--tail=15", "backend"],
                  capture_output=True, text=True, timeout=10
              )
              logs = (result.stdout or result.stderr or "(no logs)")[:800]
          except Exception as e:
              logs = f"(could not fetch logs: {e})"

          if status == "success":
              color = 3066993
              title = ":white_check_mark: CalSight Deployed Successfully"
              fields = [
                  {"name": "Commit", "value": f"[{short_sha}]({commit_url}) {msg[:100]}", "inline": False},
                  {"name": "Branch", "value": branch, "inline": True},
                  {"name": "Triggered by", "value": actor, "inline": True},
                  {"name": ":floppy_disk: Disk", "value": disk, "inline": False},
              ]
          else:
              color = 15158332
              title = ":x: CalSight Deployment FAILED"
              fields = [
                  {"name": "Commit", "value": f"[{short_sha}]({commit_url}) {msg[:100]}", "inline": False},
                  {"name": "Branch", "value": branch, "inline": True},
                  {"name": "Triggered by", "value": actor, "inline": True},
                  {"name": ":floppy_disk: Disk", "value": disk, "inline": False},
                  {"name": ":scroll: Backend logs (last 15)", "value": f"```\n{logs}\n```", "inline": False},
                  {"name": ":link: Actions Run", "value": f"[View Run]({run_url})", "inline": False},
              ]

          payload = {
              "embeds": [{
                  "title": title,
                  "color": color,
                  "fields": fields,
                  "footer": {"text": "CalSight CI/CD"}
              }]
          }

          data = json.dumps(payload).encode()
          req = urllib.request.Request(
              webhook,
              data=data,
              headers={"Content-Type": "application/json", "User-Agent": "CalSightBot/1.0"}
          )
          try:
              with urllib.request.urlopen(req, timeout=10) as resp:
                  print(f"Discord notified: {resp.status}")
          except urllib.error.HTTPError as e:
              body = e.read().decode()
              print(f"Discord HTTP error {e.code}: {body}", file=sys.stderr)
              sys.exit(1)
          PYEOF
