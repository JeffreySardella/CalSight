name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Force HTTPS for git (no SSH keys needed)
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://".insteadOf "git://"

      - name: Create backend .env from secrets
        env:
          DB_URL: ${{ secrets.DATABASE_URL }}
          CORS: ${{ secrets.CORS_ORIGINS }}
          CENSUS: ${{ secrets.CENSUS_API_KEY }}
          NOAA: ${{ secrets.NOAA_API_TOKEN }}
          BLS: ${{ secrets.BLS_API_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CEREBRAS_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: |
          : > backend/.env
          printf 'DATABASE_URL=%s\n' "$DB_URL" >> backend/.env
          printf 'CORS_ORIGINS=%s\n' "$CORS" >> backend/.env
          printf 'CENSUS_API_KEY=%s\n' "$CENSUS" >> backend/.env
          printf 'NOAA_API_TOKEN=%s\n' "$NOAA" >> backend/.env
          printf 'BLS_API_KEY=%s\n' "$BLS" >> backend/.env
          printf 'LLM_PROVIDER=groq\n' >> backend/.env
          printf 'LLM_API_KEY=%s\n' "$GROQ_KEY" >> backend/.env
          printf 'LLM_API_KEY_2=%s\n' "$GROQ_KEY_2" >> backend/.env
          printf 'LLM_FALLBACK_1_PROVIDER=gemini\n' >> backend/.env
          printf 'LLM_FALLBACK_1_KEY=%s\n' "$GEMINI_KEY" >> backend/.env
          printf 'LLM_FALLBACK_2_PROVIDER=openrouter\n' >> backend/.env
          printf 'LLM_FALLBACK_2_KEY=%s\n' "$OPENROUTER_KEY" >> backend/.env
          printf 'LLM_FALLBACK_3_PROVIDER=cerebras\n' >> backend/.env
          printf 'LLM_FALLBACK_3_KEY=%s\n' "$CEREBRAS_KEY" >> backend/.env
          printf 'DEBUG=false\n' >> backend/.env

      - name: Stop standalone cloudflared (if still running as systemd)
        run: systemctl disable --now cloudflared 2>/dev/null || true

      - name: Stage county boundaries for coord validation
        run: |
          mkdir -p backend/data
          cp frontend/public/ca-counties.geojson backend/data/ca-counties-tiger.geojson

      - name: Build and restart backend + tunnel
        env:
          CLOUDFLARED_TOKEN: ${{ secrets.CLOUDFLARED_TOKEN }}
        run: docker compose -f docker-compose.prod.yml up --build -d

      - name: Run database migrations
        run: docker compose -f docker-compose.prod.yml exec -T backend alembic upgrade head

      - name: Backfill derived fields (severity, flags, driver age, canonical cause)
        run: docker compose -f docker-compose.prod.yml exec -T backend python -m etl.backfill_derived
        timeout-minutes: 240

      - name: Backfill canonical condition columns (weather, lighting, collision, road)
        run: docker compose -f docker-compose.prod.yml exec -T backend python -m etl.backfill_conditions
        timeout-minutes: 240

      - name: Refresh materialized views
        run: docker compose -f docker-compose.prod.yml exec -T backend python -m etl.refresh_materialized_views

      - name: Validate crash coordinates (background, ~15 min)
        run: docker compose -f docker-compose.prod.yml exec -T -d backend python -m etl.validate_coords

      - name: Verify backend + tunnel are healthy
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -sf http://127.0.0.1:8000/api/health > /dev/null; then
              echo "Backend is up"
              break
            fi
            echo "Attempt $i/6 failed, waiting..."
            sleep 5
          done
          if ! curl -sf http://127.0.0.1:8000/api/health > /dev/null; then
            echo "Backend failed to start --- showing logs:"
            docker compose -f docker-compose.prod.yml logs --tail=50 backend
            exit 1
          fi
          echo "Checking tunnel..."
          docker compose -f docker-compose.prod.yml ps tunnel --format '{{.State}}' | grep -q running && echo "Tunnel is running" || { echo "Tunnel not running:"; docker compose -f docker-compose.prod.yml logs --tail=20 tunnel; exit 1; }

      - name: Collect disk usage for notification
        if: always()
        run: |
          echo "DISK=$(df -h / | awk 'NR==2 {printf "%s used / %s total (%s)", $3, $2, $5}')" >> $GITHUB_ENV
        continue-on-error: true

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_STATUS: ${{ job.status }}
          GH_SHA: ${{ github.sha }}
          GH_MSG: ${{ github.event.head_commit.message }}
          GH_REPO: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_BRANCH: ${{ github.ref_name }}
          GH_ACTOR: ${{ github.actor }}
          DISK: ${{ env.DISK }}
        run: |
          python3 - <<'PYEOF'
          import json, os, subprocess, urllib.request, sys

          status = os.environ.get("GH_STATUS", "unknown")
          sha = os.environ.get("GH_SHA", "")
          msg = os.environ.get("GH_MSG", "")
          repo = os.environ.get("GH_REPO", "")
          run_id = os.environ.get("GH_RUN_ID", "")
          branch = os.environ.get("GH_BRANCH", "")
          actor = os.environ.get("GH_ACTOR", "")
          webhook = os.environ.get("DISCORD_WEBHOOK_URL", "")
          disk = os.environ.get("DISK", "unknown")

          short_sha = sha[:7] if sha else "unknown"
          commit_url = f"https://github.com/{repo}/commit/{sha}"
          run_url = f"https://github.com/{repo}/actions/runs/{run_id}"

          if not webhook:
              print("ERROR: DISCORD_WEBHOOK_URL is not set", file=sys.stderr)
              sys.exit(1)

          try:
              result = subprocess.run(
                  ["docker", "compose", "-f", "docker-compose.prod.yml", "logs", "--tail=15", "backend"],
                  capture_output=True, text=True, timeout=10
              )
              logs = (result.stdout or result.stderr or "(no logs)")[:800]
          except Exception as e:
              logs = f"(could not fetch logs: {e})"

          if status == "success":
              color = 3066993
              title = ":white_check_mark: CalSight Deployed Successfully"
              fields = [
                  {"name": "Commit", "value": f"[{short_sha}]({commit_url}) {msg[:100]}", "inline": False},
                  {"name": "Branch", "value": branch, "inline": True},
                  {"name": "Triggered by", "value": actor, "inline": True},
                  {"name": ":floppy_disk: Disk", "value": disk, "inline": False},
              ]
          else:
              color = 15158332
              title = ":x: CalSight Deployment FAILED"
              fields = [
                  {"name": "Commit", "value": f"[{short_sha}]({commit_url}) {msg[:100]}", "inline": False},
                  {"name": "Branch", "value": branch, "inline": True},
                  {"name": "Triggered by", "value": actor, "inline": True},
                  {"name": ":floppy_disk: Disk", "value": disk, "inline": False},
                  {"name": ":scroll: Backend logs (last 15)", "value": f"```\n{logs}\n```", "inline": False},
                  {"name": ":link: Actions Run", "value": f"[View Run]({run_url})", "inline": False},
              ]

          payload = {
              "embeds": [{
                  "title": title,
                  "color": color,
                  "fields": fields,
                  "footer": {"text": "CalSight CI/CD"}
              }]
          }

          data = json.dumps(payload).encode()
          req = urllib.request.Request(
              webhook,
              data=data,
              headers={"Content-Type": "application/json"}
          )
          try:
              with urllib.request.urlopen(req, timeout=10) as resp:
                  print(f"Discord notified: {resp.status}")
          except urllib.error.HTTPError as e:
              body = e.read().decode()
              print(f"Discord HTTP error {e.code}: {body}", file=sys.stderr)
              sys.exit(1)
          PYEOF
