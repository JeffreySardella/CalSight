# Maintenance mode (2026-09-12): minor/patch bumps arrive as ONE grouped PR
# per ecosystem per week; major bumps (Python/Node base images, openai 3.x,
# TypeScript 7, wrangler 4, ...) are ignored — take those deliberately, not
# from a bot. Security updates are unaffected by `ignore`.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # ruff is 0.x: each minor reshuffles the default rule set (0.16 flags
      # 714 findings here). Bump it by hand together with the lint fixes.
      - dependency-name: "ruff"
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # The og-image Cloudflare Worker is a separate npm root with its own
  # package.json/lockfile (wrangler etc.); without this entry its deps
  # (e.g. wrangler) go un-updated.

  - package-ecosystem: npm
    directory: /workers/og-image
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  # NOTE: the docker updater only reads Dockerfiles (FROM lines) — it does NOT
  # bump image tags pinned in docker-compose*.yml. So the compose-only images
  # (postgres, cloudflared in docker-compose.prod.yml / .pipeline.yml) are not
  # covered here and must be bumped manually.
  # Docker image tags are not semver: python 3.12 -> 3.14 and node 20 -> 26
  # register as "minor", so base images are held to PATCH bumps only. Move
  # to a new Python/Node deliberately (test the ETL container first).
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
