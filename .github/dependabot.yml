# Maintenance mode (2026-09-12): minor/patch bumps arrive as ONE grouped PR
# per ecosystem per week; major bumps (Python/Node base images, openai 3.x,
# TypeScript 7, wrangler 4, ...) are ignored — take those deliberately, not
# from a bot. Security updates are unaffected by `ignore`.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # The og-image Cloudflare Worker is a separate npm root with its own
  # package.json/lockfile (wrangler etc.); without this entry its deps
  # (e.g. wrangler) go un-updated.

  - package-ecosystem: npm
    directory: /workers/og-image
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  # NOTE: the docker updater only reads Dockerfiles (FROM lines) — it does NOT
  # bump image tags pinned in docker-compose*.yml. So the compose-only images
  # (postgres, cloudflared in docker-compose.prod.yml / .pipeline.yml) are not
  # covered here and must be bumped manually.
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
