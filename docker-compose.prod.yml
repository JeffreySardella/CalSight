services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DEBUG: "false"
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      # Cold start (imports + DB pool warmup) can exceed one interval;
      # don't count those probes as failures.
      start_period: 30s

# NOTE: the `tunnel:` service was REMOVED on 2026-08-11.
#
# It ran cloudflared from a TUNNEL_TOKEN that has been invalid since the
# 2026-07-30 tunnel-token rotation, so every deploy recreated a container that
# retry-looped `Unauthorized: Invalid tunnel secret` roughly once a minute
# forever (~62,000 log lines by the time it was first noticed) while carrying
# no traffic at all — a tunnel that cannot register serves nothing.
#
# api.calsight.org is served by the SYSTEMD cloudflared on the prod host
# (tunnel 351caa6f-ce8e-442a-953d-1ee602dc565c, /etc/cloudflared/config.yml),
# which is healthy and entirely independent of this compose file. Removing this
# service therefore changes nothing about what is reachable.
#
# Deleting the container by hand did NOT stick: this is a defined service, so
# CI recreated it on the next deploy. The repo was the only real fix.
